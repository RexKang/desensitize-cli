<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>desensitize gui</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#1f2328;background:#f6f8fa}
.top{background:#fff;border-bottom:1px solid #e3e8ee;padding:9px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:6}
.top h1{font-size:16px;margin:0;font-weight:700}
.top .sub{color:#57606a;font-size:12px}
.sp{flex:1}
.note{background:#fff8c5;border:1px solid #eed888;color:#9a6700;font-size:14px;padding:6px 12px;border-radius:6px;margin:9px 16px 0;line-height:1.55}
.steps{display:flex;gap:2px;flex:1 0 100%;border-top:1px solid #eef1f4;margin-top:8px}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:14px;color:#57606a;cursor:pointer;white-space:nowrap}
.step b{font-weight:600}
.step i{font-style:normal;font-size:12px;color:#57606a;font-weight:400}
.step:hover{color:#0969da}
.step.on{color:#0969da;border-bottom-color:#0969da}
.step.on b{font-weight:700}
.step.done b::after{content:" ✓";color:#1f883d;font-weight:700}
.report-meta{font-size:12px;color:#57606a;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{padding:10px 16px 12px;display:flex;flex-direction:column;min-height:calc(100vh - 104px)}
.g{display:grid;grid-template-columns:280px minmax(0,1fr) 380px;gap:12px;align-items:start}
.g>div:last-child,.g>.panel:first-child{position:sticky;top:104px}
.panel{background:#fff;border:1px solid #e3e8ee;border-radius:8px;overflow:hidden}
.ph{font-size:12px;letter-spacing:.04em;color:#57606a;padding:9px 12px 5px;display:flex;align-items:center;gap:6px}
.btn{border:1px solid #d0d7de;background:#fff;border-radius:6px;padding:5px 10px;font:inherit;font-size:14px;cursor:pointer;color:#24292f;white-space:nowrap}
.btn:hover{background:#f6f8fa}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dry{background:#1f883d;border-color:#1f883d;color:#fff;font-weight:600}
.btn.dry:hover{background:#1a7f37}
.btn.danger{background:#cf222e;border-color:#cf222e;color:#fff;font-weight:600}
.btn.danger:hover{background:#a40e26}
.btn.blue{background:#0969da;border-color:#0969da;color:#fff;font-weight:600}
.btn.blue:hover{background:#0757ba}
.btn.ghost{border-color:transparent;color:#0969da;background:transparent}
.btn.mini{padding:4px 9px;font-size:12px}
.badge{display:inline-block;font-size:12px;padding:0 6px;border-radius:9px;background:#eef2f6;color:#57606a;line-height:18px;white-space:nowrap}
.badge.on{background:#dafbe1;color:#1a7f37}
.badge.warn{background:#fff8c5;color:#9a6700}
.badge.err{background:#ffebe9;color:#cf222e}
.badge.num{background:#e7f0fb;color:#0a3069}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
input[type=text],select{width:100%;padding:4px 8px;border:1px solid #d0d7de;border-radius:6px;font:inherit;font-size:14px;background:#fff;color:#1f2328}
input[type=text]:focus,select:focus{outline:2px solid #cfe3ff;border-color:#0969da}
label.f{display:block;font-size:12px;color:#57606a;margin:8px 0 3px}
.row{display:flex;gap:6px;align-items:center}
.hint{font-size:12px;color:#57606a}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{width:27px;height:16px;border-radius:8px;background:#d0d7de;position:relative;display:inline-block;vertical-align:middle;cursor:pointer;flex:none}
.sw.on{background:#2da44e}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
.sw.on::after{left:13px}
mark{background:#ffd8d3;color:#82071e;font-weight:600;padding:0 1px;border-radius:2px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:4px 7px;border-bottom:1px solid #eef1f4;font-size:14px;vertical-align:top}
th{color:#57606a;font-size:12px;font-weight:600;background:#fbfcfd}
#banner{display:none;margin:9px 16px 0;padding:6px 11px;border-radius:6px;font-size:14px}
#banner.err{display:block;background:#ffebe9;border:1px solid #f5c2c0;color:#cf222e}
#banner.ok{display:block;background:#dafbe1;border:1px solid #aee9c1;color:#1a7f37}
#banner.warn{display:block;background:#fff8c5;border:1px solid #eed888;color:#9a6700}

.rlist{max-height:44vh;overflow:auto;padding:0 6px 2px}
.ritem{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;cursor:pointer;border-left:2px solid transparent}
.ritem:hover{background:#f6f8fa}
.ritem.on{background:#e7f0fb;border-left-color:#0969da}
.ritem .txt{flex:1;min-width:0}
.ritem .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .meta{font-size:12px;color:#57606a;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem .tg{flex:none;cursor:pointer}
.pad{padding:6px 10px 10px}
.cases{padding:0 10px 10px;max-height:28vh;overflow:auto}
.case{padding:5px 6px;border-radius:6px;cursor:pointer}
.case:hover{background:#f6f8fa}
.case .h{display:flex;align-items:center;gap:6px}
.case .nm{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case .d{font-size:12px;color:#57606a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:16px 10px;text-align:center;color:#57606a;font-size:14px}
.empty .big{font-size:14px;color:#3d4451;margin-bottom:6px}

.checkline{font-size:12px;margin-top:5px;color:#1a7f37}
.checkline.bad{color:#cf222e}
.demo{font-size:12px;color:#57606a;margin-top:3px;min-height:19px}
.demo b{color:#1a7f37}
.probe{max-height:22vh;overflow:auto;border:1px solid #eef1f4;border-radius:6px;margin-top:6px}
.probe table th{position:sticky;top:0;z-index:1}
.ctx{color:#3d4451;margin-top:2px}
.floc{font-size:12px;color:#57606a}
.fname{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;align-items:center;margin-top:9px;font-size:12px;color:#57606a}
.opts .n{width:auto;flex:1;min-width:0;padding:3px 6px;font-size:12px}
.opts select{padding:3px 7px;font-size:12px;width:100%}
.opts .full{grid-column:1 / -1;display:flex;gap:8px;align-items:center}
.opts .full input{flex:1}
.opts .full .lb{flex:none;width:32px}
.queue{padding:0 10px 4px}
.q{border:1px solid #d8dee4;border-radius:8px;padding:7px 9px;margin-bottom:7px;background:#fff;position:relative}
.q .h{display:flex;align-items:center;gap:6px}
.q .no{font-weight:700;color:#0969da;font-size:14px;flex:none}
.q .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .m{color:#57606a;font-size:12px;margin-top:3px;line-height:1.5;padding-right:12px}
.q .acts{display:flex;gap:4px;margin-top:5px}
.q .x{position:absolute;right:2px;top:0;padding:4px 8px;color:#57606a;cursor:pointer;font-size:16px;line-height:1.2}
.q .x:hover{color:#cf222e}
.q.total{background:#f6f8fa;border-style:dashed;margin-bottom:2px}
.q.total .t{font-size:14px}
.actionbar{position:sticky;bottom:0;margin-top:auto;z-index:5;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e3e8ee;border-radius:8px;padding:8px 12px;margin-bottom:0;box-shadow:0 -4px 14px rgba(31,35,40,.06)}
.ab-sum{flex:1;min-width:0;font-size:12px;color:#57606a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab-sum b{color:#1f2328}
.ab-btns{display:flex;gap:8px;flex:none}
.ab-btns .btn{padding:7px 14px}
#summary{padding:4px 14px 8px}
#summary .line{font-size:14px;color:#57606a;line-height:1.6}
#summary .line b{color:#1f2328}
#rowsWrap{max-height:64vh;overflow:auto;padding:0 14px 14px}
#rowsWrap table th{position:sticky;top:0;z-index:1}
#rowsWrap tbody tr:nth-child(4n+1) td,
#rowsWrap tbody tr:nth-child(4n+2) td{background:#fbfcfd}

.mask{position:fixed;inset:0;background:rgba(31,35,40,.34);display:none;z-index:20}
.mask.on{display:block}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(31,35,40,.34)}
.modal.on{display:flex}
.pbox{background:#fff;border-radius:10px;width:620px;max-width:94vw;max-height:84vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(31,35,40,.24)}
.pbox .hh{padding:11px 14px;border-bottom:1px solid #eef1f4;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.pbox .bar{padding:8px 12px;border-bottom:1px solid #eef1f4;display:flex;gap:6px;align-items:center;background:#fbfcfd}
.pbox .pfoot{padding:10px 14px;border-top:1px solid #eef1f4;display:flex;gap:8px;align-items:center;background:#fbfcfd}
.pbox .pbody{padding:10px 14px;overflow:auto}
.plist{overflow-y:auto;padding:4px 6px;min-height:240px}
.pitem{padding:6px 9px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
.pitem:hover{background:#eef2f6}
.pitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:flex;gap:8px;font-size:14px;padding:2px 0}
.kv .k{color:#57606a;width:56px;flex:none}
.kv .v{flex:1;word-break:break-all}
.slist{max-height:40vh;overflow:auto;border:1px solid #eef1f4;border-radius:6px;padding:9px 12px;margin-top:8px}
.sblock{margin-bottom:10px}
.sblock .h{font-size:14px;font-weight:700;margin-bottom:4px}
.sblock .r{font-size:14px;color:#3d4451;padding:1px 0 2px 14px;line-height:1.55}
.sblock .off{color:#57606a}

.taskbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #e3e8ee;border-radius:8px;padding:8px 10px;margin-bottom:12px}
.taskbar .tb-label{font-size:12px;color:#57606a;flex:none}
.taskbar #target{flex:1;min-width:240px;width:auto}
.tb-opts{position:relative}
.tb-opts>summary,.presets>summary{list-style:none;cursor:pointer}
.tb-opts>summary::-webkit-details-marker,.presets>summary::-webkit-details-marker{display:none}
.tb-opts .opts{position:absolute;right:0;top:34px;width:440px;margin:0;padding:10px 12px;background:#fff;border:1px solid #d8dee4;border-radius:8px;box-shadow:0 10px 28px rgba(31,35,40,.16);z-index:12}
.taskcard{padding:2px 12px 12px;display:grid;gap:6px}
.kvrow{display:flex;gap:10px;align-items:baseline;font-size:12px;color:#57606a}
.kvrow .k{flex:none;width:60px}
.kvrow .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1f2328}
.presets{position:relative;margin-left:auto}
.presets .cases{position:absolute;right:0;top:32px;width:400px;max-height:360px;overflow:auto;margin:0;padding:6px;background:#fff;border:1px solid #d8dee4;border-radius:8px;box-shadow:0 10px 28px rgba(31,35,40,.16);z-index:12}
.case .d{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style></head><body>

<div class="top">
  <h1>desensitize gui</h1>
  <span class="sub">测试数据脱敏 · 先试跑再写盘</span>
  <span class="sp"></span>
  <span class="badge num" id="rulesBadge" title="规则库文件">rules.json · 0 条</span>
  <button class="btn" id="saveBtn">保存规则库</button>
  <button class="btn" id="saveAsBtn">另存为…</button>
  <button class="btn ghost" id="quitBtn">退出</button>

  <div class="steps" id="stepBar">
    <button class="step" id="step1" data-step="1"><b>① 目标</b><i id="step1v">未选择</i></button>
    <button class="step on" id="step2" data-step="2"><b>② 规则</b><i id="step2v">0 条</i></button>
    <button class="step" id="step3" data-step="3"><b>③ 预演</b><i id="step3v">未预演</i></button>
    <button class="step" id="step4" data-step="4"><b>④ 执行</b><i id="step4v">未执行</i></button>
  </div>
</div>
<div id="banner"></div>

<div class="stage">
  <div class="taskbar" id="targetPanel">
    <span class="tb-label">目标</span>
    <input type="text" id="target" class="mono" placeholder="选目录或单个文件，也可以直接粘贴路径">
    <button class="btn" id="pickDirBtn">选择目录…</button>
    <button class="btn" id="pickFileBtn">选择文件…</button>
    <button class="btn ghost" id="browseBtn" title="内置目录浏览器（原生对话框不可用时用它）">手选…</button>
    <details class="tb-opts">
      <summary class="btn">任务设置 ▾</summary>
      <div class="opts">
        <label style="display:flex;gap:6px;align-items:center">递归 <span class="sw on" id="swRec"></span></label>
        <label style="display:flex;gap:6px;align-items:center">上限 <input class="n" type="text" id="inLimit" value="200"></label>
        <label class="full"><span class="lb">备份</span>
          <select id="selBackup">
            <option value="file">按文件 .bak</option>
            <option value="zip">整体 .bak.zip</option>
            <option value="none">不备份</option>
          </select>
        </label>
        <span class="full"><span class="lb">报告</span><input type="text" id="inReport" value="明细.html"></span>
      </div>
    </details>
  </div>

  <div id="paneCfg">
    <div class="g">

      <div class="panel">
        <div class="ph">规则库<span class="sp"></span><span class="hint" id="ruleCount"></span></div>
        <div class="rlist" id="listRules"></div>
        <div class="pad"><button class="btn" id="addBtn" style="width:100%">+ 新增规则</button></div>
      </div>

      <div class="panel" id="editorPanel">
        <div class="ph"><span id="editTitle">编辑</span><span class="sp"></span><span class="hint" id="editHint"></span>
          <details class="presets">
            <summary class="btn mini">从模板开始 ▾</summary>
            <div class="cases" id="listCases"></div>
          </details>
        </div>
        <div class="body" id="editor" style="padding:2px 12px 12px"></div>
      </div>

      <div>
        <div class="panel" id="taskPanel">
          <div class="ph">本次任务<span class="sp"></span><span class="hint" id="taskHint"></span></div>
          <div class="taskcard" id="taskCard"></div>
        </div>

        <div class="panel" id="queuePanel" style="margin-top:12px">
          <div class="ph">待执行规则<span class="sp"></span><span class="hint" id="queueHint"></span>
            <button class="btn mini ghost" id="clearQueueBtn">清空</button></div>
          <div class="queue" id="queueList"></div>
        </div>
      </div>

    </div>
  </div>

  <div id="paneReport" style="display:none">
    <div class="panel">
      <div class="ph">运行报告<span class="sp"></span><span class="hint" id="prevHint"></span><span class="report-meta" id="reportMeta"></span>
        <button class="btn mini" id="reportBtn">导出报告</button>
        <button class="btn blue mini" id="clearBtn">清空结果</button></div>
      <div id="summary"></div>
      <div id="rowsWrap" style="display:none"></div>
    </div>
  </div>

  <div class="actionbar" id="actionBar">
    <span class="badge warn" id="taskState">未预演</span>
    <div class="ab-sum" id="taskLine"></div>
    <div class="ab-btns">
      <button class="btn" id="showReportBtn" disabled>看报告</button>
      <button class="btn dry" id="runBtn">空跑</button>
      <button class="btn danger" id="execBtn" disabled title="先空跑并确认命中面">执行…</button>
    </div>
  </div>
</div>

<div class="modal" id="confirmBox">
  <div class="pbox">
    <div class="hh">确认执行<span class="sp"></span><span class="hint">只有启用的规则会被执行</span></div>
    <div class="pbody">
      <div class="kv"><span class="k">目标</span><span class="v mono" id="cfTarget"></span></div>
      <div class="kv"><span class="k">将改写</span><span class="v" id="cfScope"></span></div>
      <div class="kv"><span class="k">上次预演</span><span class="v" id="cfPreview"></span></div>
      <div class="kv"><span class="k">备份</span><span class="v" id="cfBackup"></span></div>
      <div class="kv"><span class="k">报告</span><span class="v" id="cfReport"></span></div>
      <div class="kv"><span class="k">顺序</span><span class="v" id="cfSteps"></span></div>
      <div class="slist" id="cfRules"></div>
      <div class="hint" id="cfWarn" style="margin-top:10px;color:#9a6700;display:none"></div>
      <div class="hint" style="margin-top:10px;color:#cf222e">执行会原地覆盖文件（先按上面的方式备份），确认无误再点。</div>
    </div>
    <div class="pfoot">
      <span class="sp"></span>
      <button class="btn" id="cfCancel">取消</button>
      <button class="btn danger" id="cfOk">确认执行</button>
    </div>
  </div>
</div>

<div class="modal" id="saveAsBox">
  <div class="pbox" style="width:600px">
    <div class="hh">规则库另存为<span class="sp"></span></div>
    <div class="pbody">
      <label class="f">目录</label>
      <div class="row">
        <input type="text" id="saDir" placeholder="点「浏览…」选目录">
        <button class="btn" id="saBrowse">浏览…</button>
      </div>
      <label class="f">文件名</label>
      <input type="text" id="saName" value="rules.json">
      <div class="hint" style="margin-top:6px">保存后，后续「保存规则库」也会跟着写到这里。</div>
      <div class="hint" id="saMsg" style="margin-top:4px;color:#cf222e"></div>
    </div>
    <div class="pfoot">
      <span class="sp"></span>
      <button class="btn" id="saCancel">取消</button>
      <button class="btn blue" id="saOk">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="picker">
  <div class="pbox" style="width:580px">
    <div class="hh">选择目录<span class="sp"></span><span class="hint mono" id="pickPath"></span></div>
    <div class="bar">
      <button class="btn mini" id="pickUp">↑ 上级</button>
      <button class="btn mini" id="pickRoots">盘符 / 根</button>
      <span class="sp"></span>
      <span class="hint" id="pickNote"></span>
    </div>
    <div class="plist" id="pickList"></div>
    <div class="pfoot">
      <span class="hint">点目录进入，点「选这个目录」确认当前层</span>
      <span class="sp"></span>
      <button class="btn" id="pickCancel">取消</button>
      <button class="btn blue" id="pickOk">选这个目录</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const token = new URLSearchParams(location.search).get('t') || '';
let state = {rules: [], presets: [], rulesPath: '', rulesMtime: 0, version: ''};
let sel = 0;
let dirty = false;
let opts = {recursive: true, limit: 200, backup: 'file', report: '明细.html'};
let queue = [];          // 待执行规则：{name, rules, est}
let loadedPreset = '';   // 从哪个模板载入的，用作队列项名字
let pick = {path: '', parent: ''};
let pickMode = 'target'; // target | saveas
let probe = null;        // 单条试跑结果
let probeSeq = 0;
let lastRun = null;

/* ── 小工具 ───────────────────────────── */
function el(tag, cls, text) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text !== undefined && text !== null) d.textContent = text;
  return d;
}

function banner(kind, msg, action) {
  const b = $('#banner');
  b.className = kind;
  b.innerHTML = '';
  b.append(document.createTextNode(msg + ' '));
  if (action) {
    const btn = el('button', 'btn mini', action.label);
    btn.onclick = action.fn;
    b.append(btn);
  }
  if (kind === 'ok') setTimeout(() => { if (b.className === 'ok') b.className = ''; }, 6000);
}

async function api(path, body) {
  const opt = {headers: {'X-Token': token}};
  if (body !== undefined) {
    opt.method = 'POST';
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(path, opt);
  if (!r.ok && r.status !== 409) throw new Error('HTTP ' + r.status);
  return await r.json();
}

const activeRules = rules => (rules || []).filter(r => r.enabled !== false);
const ruleName = r => r.desc || r.id || '(未命名)';
const baseName = p => { const seg = String(p || '').split(/[\\/]/); return seg.pop() || '(未知)'; };
const dirOf = p => { const seg = String(p || '').split(/[\\/]/); seg.pop(); return seg.join('/'); };

/* ── 步骤条：目标 → 规则 → 预演 → 执行 ─────── */
let activeStep = 2;

function setStep(n) {
  if (n === 1) { $('#target').focus(); return; }
  if (n === 2) { showPane('cfg'); return; }
  if (n === 3) {
    if (!lastRun) { banner('warn', '还没有预演结果：先点底部「空跑」，命中明细会出现在这里。'); return; }
    showPane('report');
    return;
  }
  openConfirm();
}

function showPane(name) {
  const cfg = name !== 'report';
  $('#paneCfg').style.display = cfg ? '' : 'none';
  $('#paneReport').style.display = cfg ? 'none' : '';
  $('#showReportBtn').style.display = cfg ? '' : 'none';
  activeStep = cfg ? 2 : (lastRun && lastRun.dry === false ? 4 : 3);
  renderSteps();
  window.scrollTo(0, 0);
}

function renderSteps() {
  const target = $('#target').value.trim();
  const act = activeRules(state.rules).length;
  $('#step1v').textContent = target ? baseName(target) : '未选择';
  $('#step2v').textContent = state.rules.length + ' 条 · 启用 ' + act;
  $('#step3v').textContent = lastRun
    ? (lastRun.dry === false ? '已执行' : lastRun.hits + ' 命中')
    : '未预演';
  $('#step4v').textContent = (lastRun && lastRun.dry === false)
    ? '已写 ' + (lastRun.written || 0) + ' 文件'
    : '未执行';
  const done = [!!target, act > 0, !!lastRun, !!(lastRun && lastRun.dry === false)];
  [1, 2, 3, 4].forEach(n => {
    const b = $('#step' + n);
    b.classList.toggle('on', n === activeStep);
    b.classList.toggle('done', done[n - 1] && n !== activeStep);
  });
}

function setReportCount() { renderSteps(); }
[1, 2, 3, 4].forEach(n => { $('#step' + n).onclick = () => setStep(n); });

function metaOf(r) {
  const bits = [r.type || 'regex'];
  if (r.type === 'literal') bits.push(r.find || '(空 find)');
  else if (r.type === 'digits') bits.push(r.length + ' 位');
  else if (r.type === 'ip_shift') bits.push((r.source_cidrs && r.source_cidrs.length) ? r.source_cidrs.join(' ') : '全部 IP');
  else if (r.type === 'hash') bits.push('保留尾 ' + (r.keep_tail || 0) + ' 位');
  else if (r.type === 'strip_images') bits.push('删除 docx/xlsx 图片（含页眉页脚）');
  else bits.push(r.pattern || '(空 pattern)');
  return bits.join(' · ');
}

let checkTimer = null;
function scheduleCheck() {
  clearTimeout(checkTimer);
  const r = state.rules[sel];
  if (!r || r.type === 'strip_images') return; // 结构型规则不扫文本
  checkTimer = setTimeout(() => checkRule(r), 450);
}

async function checkRule(r) {
  const line0 = $('#checkLine');
  const demo0 = $('#demoLine');
  if (r.type === 'strip_images') {
    if (line0) {
      line0.className = 'checkline';
      line0.textContent = '✓ 结构型规则 · 只对 .docx / .xlsx 生效，其它文件自动跳过';
    }
    if (demo0) demo0.textContent = '';
    return;
  }
  try {
    const res = await api('/api/rule-check', {rule: r});
    if (state.rules[sel] !== r) return;
    const line = $('#checkLine');
    const demo = $('#demoLine');
    if (!line || !demo) return;
    if (!res.ok) {
      line.className = 'checkline bad';
      line.textContent = '× ' + (res.error || '检查失败');
      return;
    }
    const c = res.check;
    if (!c.valid) {
      line.className = 'checkline bad';
      line.textContent = '× ' + (c.error || '规则不合法');
      demo.textContent = '';
      return;
    }
    line.className = 'checkline';
    line.textContent = '✓ 样例校验通过' + (c.hits ? ' · 内置样本里命中 ' + c.hits + ' 处' : ' · 内置样本里没命中');
    demo.innerHTML = '';
    if (c.demo) {
      demo.append(document.createTextNode('示例：' + c.demo.before + ' → '));
      demo.append(el('b', null, c.demo.after === '' ? '（删除）' : c.demo.after));
    } else {
      demo.append(document.createTextNode('样本里没命中：换个 pattern，或直接单条试跑看真实数据。'));
    }
  } catch (e) { /* 编辑中的临时错误不打扰用户 */ }
}

async function probeRule() {
  const r = state.rules[sel];
  if (!r) return;
  const target = $('#target').value.trim();
  if (!target) { banner('err', '先选目标目录或文件，再试跑'); return; }
  const seq = ++probeSeq;
  const hint = $('#probeHint');
  if (hint) hint.textContent = '试跑中…';
  try {
    const res = await api('/api/preview', {target, rules: [r], recursive: opts.recursive, limit: opts.limit});
    if (seq !== probeSeq) return;
    if (!res.ok) {
      if ($('#probeHint')) $('#probeHint').textContent = '';
      banner('err', res.error || '试跑失败');
      return;
    }
    probe = res.result;
    renderProbe();
  } catch (e) {
    banner('err', '试跑失败：' + e.message);
  }
}

/* ── 待执行队列 ───────────────────────── */
function ruleSig(rules) {
  return (rules || []).map(r => {
    const o = {};
    Object.keys(r).sort().forEach(k => { o[k] = r[k]; });
    return JSON.stringify(o);
  }).join('\u0001');
}

function queueBadge(q) {
  if (!activeRules(q.rules).length) return {cls: 'err', text: '无启用规则'};
  if (ruleSig(q.rules) !== ruleSig(state.rules)) return {cls: 'warn', text: '规则库已改'};
  return {cls: 'on', text: '一致'};
}

    const act = activeRules(q.rules);

    const names = act.slice(0, 3).map(ruleName).join('、');
    if (names) m.append(document.createTextNode(' · ' + names + (act.length > 3 ? ' 等' : '')));
    if (q.est) m.append(document.createTextNode(' · 预计 ' + q.est.hits + ' 处 / ' + q.est.files + ' 文件'));
    d.append(m);

    const acts = el('div', 'acts');
    const up = el('button', 'btn mini', '上移');
    up.disabled = i === 0;
    up.onclick = () => { if (i > 0) { const t = queue[i - 1]; queue[i - 1] = queue[i]; queue[i] = t; clearEst(); renderQueue(); } };
    const down = el('button', 'btn mini', '下移');
    down.disabled = i === queue.length - 1;
    down.onclick = () => { if (i < queue.length - 1) { const t = queue[i + 1]; queue[i + 1] = queue[i]; queue[i] = t; clearEst(); renderQueue(); } };
    const pv = el('button', 'btn mini', '预览');
    pv.onclick = () => previewQueueItem(i);
    acts.append(up, down, pv);
    if (b.cls === 'warn') {
      const sync = el('button', 'btn mini', '同步规则库');
      sync.onclick = () => {
        q.rules = JSON.parse(JSON.stringify(state.rules));
        delete q.est;
        renderQueue();
        banner('ok', '已把「' + q.name + '」同步成当前规则库');
      };
      acts.append(sync);
    }
    d.append(acts);
    box.append(d);
  });

  // 合计
  const total = el('div', 'q total');
  const th = el('div', 'h');
  th.append(el('span', 't', '合计'), el('span', 'sp'));
  const actQ = queue.length ? queue : [{rules: state.rules}];
  const totalActive = actQ.reduce((n, q) => n + activeRules(q.rules).length, 0);
  const ready = queue.length && queue.every(q => q.est);
  const estHits = ready ? queue.reduce((n, q) => n + q.est.hits, 0) : null;
  const estFiles = ready ? queue.reduce((n, q) => n + q.est.files, 0) : null;
  th.append(el('span', 'badge num', totalActive + ' 条规则' + (estHits !== null ? ' · ' + estFiles + ' 文件 · ' + estHits + ' 处' : '')));
  total.append(th);
  const tm = el('div', 'm');
  tm.textContent = queue.length
    ? '顺序执行：同一文件被多套规则命中时合并成一次改写，最后只写一次盘。'
    : '队列是空的：空跑 / 执行会用当前规则库（' + activeRules(state.rules).length + ' 条启用）。';
  total.append(tm);
  box.append(total);
  $('#queueHint').textContent = queue.length ? queue.length + ' 套' : '未排队';
  renderTask();
}

/* ── 本次任务摘要（右栏 + 底部操作条）────── */
function renderTask() {
  const target = $('#target').value.trim();
  const steps = stepsForRun();
  const act = steps.reduce((n, st) => n + activeRules(st.rules).length, 0);
  const card = $('#taskCard');
  card.innerHTML = '';
  const row = (k, v, full) => {
    const d = el('div', 'kvrow');
    const vv = el('span', 'v', v);
    if (full) vv.title = full;
    d.append(el('span', 'k', k), vv);
    card.append(d);
  };
  row('目标', target ? baseName(target) : '未选择', target);
  row('规则', (queue.length ? queue.length + ' 套' : '当前规则库') + ' · 启用 ' + act + ' 条');
  row('预演', lastRun
    ? (lastRun.dry === false ? '已执行 · ' + (lastRun.written || 0) + ' 文件' : lastRun.hits + ' 处 · ' + lastRun.files + ' 文件')
    : '未预演');
  row('备份', {zip: '整体 .bak.zip', file: '按文件 .bak', none: '不备份'}[opts.backup] || opts.backup);
  row('报告', opts.report || '（不导出）');

  const bits = [target ? baseName(target) : '未选目标', queue.length ? queue.length + ' 套规则' : act + ' 条规则'];
  bits.push({zip: '整体备份', file: '按文件备份', none: '不备份'}[opts.backup] || opts.backup);
  $('#taskLine').textContent = bits.join(' · ');

  const fresh = previewFresh();
  const done = !!(lastRun && lastRun.dry === false);
  const stale = !!lastRun && !fresh && !done;
  $('#execBtn').disabled = !fresh;
  $('#execBtn').title = fresh ? '执行（写前会再确认一次）' : '先空跑一次，确认命中面后再执行';
  const st = $('#taskState');
  st.className = 'badge ' + (done ? 'on' : fresh ? 'num' : 'warn');
  st.textContent = done ? '已执行' : fresh ? '已预演' : stale ? '需重新空跑' : '未预演';
  renderSteps();
}

function clearEst() { queue.forEach(q => delete q.est); }

function enqueue() {
  if (!state.rules.length) { banner('err', '规则库是空的，先从模板载入一套'); return; }
  const act = activeRules(state.rules);
  if (!act.length) { banner('err', '当前规则库没有启用的规则'); return; }
  let name = loadedPreset;
  if (!name) name = act.length === 1 ? ruleName(act[0]) : '策略 ' + (queue.length + 1);
  if (queue.some(q => q.name === name)) name = name + ' #' + (queue.length + 1);
  queue.push({name, rules: JSON.parse(JSON.stringify(state.rules))});
  renderQueue();
  banner('ok', '已加入待执行：' + name + '（' + act.length + ' 条启用规则）');
}

async function previewQueueItem(i) {
  const q = queue[i];
  if (!q) return;
  const target = $('#target').value.trim();
  if (!target) { banner('err', '先选目标目录或文件'); return; }
  try {
    const res = await api('/api/preview', {target, rules: q.rules, recursive: opts.recursive, limit: opts.limit});
    if (!res.ok) { banner('err', res.error || '预览失败'); return; }
    setReportCount(res.result.hits);
    $('#reportMeta').textContent = '预览：' + q.name + ' · ' + target;
    $('#reportMeta').title = target;
    $('#showReportBtn').disabled = false;
    renderResult(res.result, '预览：' + q.name);
    showPane('report');
  } catch (e) { banner('err', '预览失败：' + e.message); }
}

/* ── 目标与选项 ───────────────────────── */

$('#inLimit').oninput = e => { opts.limit = parseInt(e.target.value) || 200; clearEst(); renderQueue(); };
$('#selBackup').onchange = e => { opts.backup = e.target.value; };

async function ls(path) {
  const res = await api('/api/ls' + (path ? '?path=' + encodeURIComponent(path) : ''));

/* ── 空跑 / 执行 ──────────────────────── */
function runSig() {
  const all = [].concat(...stepsForRun().map(st => st.rules || []));
  return ruleSig(all) + '|' + $('#target').value.trim() + '|' + opts.backup + '|' + opts.report + '|' + opts.recursive + '|' + opts.limit;
}

function previewFresh() {
  return !!(lastRun && lastRun.dry === true && lastRun.sig === runSig());
}

function stepsForRun() {
  if (queue.length) return queue.map(q => ({name: q.name, rules: q.rules}));
  return [{name: '当前规则库', rules: state.rules}];
}

async function runFlow(dry, forceOpen) {
  const target = $('#target').value.trim();
  if (!target) { banner('err', '先选目标目录或文件'); return null; }
  const steps = stepsForRun();
  if (!steps.some(st => activeRules(st.rules).length)) {
    banner('err', '没有启用的规则，先启用几条或从模板载入一套');
    return null;
  }
  $('#runBtn').disabled = true;
  $('#execBtn').disabled = true;
  if (dry) $('#runBtn').textContent = '空跑中…'; else $('#execBtn').textContent = '执行中…';
  $('#prevHint').textContent = dry ? '空跑中…' : '执行中…';
  try {
    const res = await api('/api/run', {
      target, steps, recursive: opts.recursive, limit: opts.limit,
      backup: opts.backup, report: opts.report, dry, open: forceOpen || !dry
    });
    if (!res.ok) { banner('err', res.error || '执行失败'); return null; }
    const r = res.result;
    r.sig = runSig();
    r.at = Date.now();
    lastRun = r;
    renderTask();
    $('#reportMeta').textContent = (dry ? '空跑' : '执行') + ' · ' + target + ' · ' + fmtTime(new Date());
    $('#reportMeta').title = target;
    $('#showReportBtn').disabled = false;
    if (dry && queue.length && r.steps) {
      r.steps.forEach((st, i) => { if (queue[i]) queue[i].est = {hits: st.hits, files: st.files}; });
      renderQueue();
    }
    renderResult(r, dry ? '空跑结果' : '执行结果');
    showPane('report');
    if (dry) {
      banner('ok', '空跑完成：扫描 ' + r.files + ' 个文件 · 命中 ' + r.hits + ' 处，未写盘。'
        + (r.report ? ' 报告：' + r.report : ''));
    } else {
      banner('ok', '已写入 ' + r.written + ' 个文件（' + r.hits + ' 处）'
        + (r.failed ? '，失败 ' + r.failed + ' 个' : '')
        + (r.backup ? '，整体备份 ' + baseName(r.backup) : ''));
    }
    return r;
  } catch (e) {
    banner('err', '请求失败：' + e.message);
    return null;
  } finally {
    $('#runBtn').disabled = false;
    renderTask();
    $('#runBtn').textContent = '空跑';
    $('#execBtn').textContent = '执行…';
    $('#prevHint').textContent = lastRun ? lastRun.elapsedMs + ' ms' : '';
  }
}

function renderResult(r, title) {
  const sum = $('#summary');
  sum.innerHTML = '';
  const hitFiles = (r.hitFiles !== undefined && r.hitFiles !== null)
    ? r.hitFiles
    : new Set((r.rows || []).map(x => x.file)).size;
  const line = el('div', 'line');
  line.append(el('b', null, title || '结果'));
  line.append(document.createTextNode('：扫描 ' + r.files + ' 个文件，其中 ' + hitFiles + ' 个命中 '));
  line.append(el('b', null, String(r.hits)));
  line.append(document.createTextNode(' 处 · ' + (r.rows || []).length + ' 条明细'
    + (r.truncated ? '（达到扫描上限，先缩小范围）' : '')));
  sum.append(line);

  if (r.steps && r.steps.length > 1) {
    const sd = el('div', 'line');
    sd.textContent = '按顺序：' + r.steps.map(x => x.name + ' ' + x.hits + ' 处').join('  →  ') + '（同一文件合并成一次改写）';
    sum.append(sd);
  }
  if (r.dry === false && r.written !== undefined && r.written !== null) {
    const wd = el('div', 'line');
    wd.style.color = r.failed ? '#cf222e' : '#1a7f37';
    wd.textContent = '已写入 ' + r.written + ' 个文件' + (r.failed ? '，失败 ' + r.failed + ' 个' : '')
      + (r.backup ? ' · 整体备份 ' + r.backup : '') + (r.report ? ' · 报告 ' + r.report : '');
    sum.append(wd);
  }
  (r.problems || []).slice(0, 6).forEach(p => {
    const d = el('div', 'line');
    d.style.color = '#9a6700';
    d.textContent = '· ' + p;
    sum.append(d);
  });

  const wrap = $('#rowsWrap');
  wrap.innerHTML = '';
  wrap.style.display = 'block';
  if (!r.rows || !r.rows.length) {
    wrap.append(el('div', 'hint', '没有命中。换个规则、放宽 pattern，或确认目标目录里真有这些数据。'));
    return;
  }
  const t = el('table');
  const thead = el('thead');
  const hr = el('tr');
  [['文件 / 位置', '200px'], ['规则', '88px'], ['原文 → 替换后', '300px'], ['上下文', '']].forEach(([n, w]) => {
    const th = el('th', null, n);
    if (w) th.style.width = w;
    hr.append(th);
  });
  thead.append(hr);
  const tb = el('tbody');
  r.rows.slice(0, 400).forEach(x => {
    const tr = el('tr');
    const c1 = el('td');
    c1.append(el('div', 'fname mono', baseName(x.file)));
    c1.append(el('div', 'floc', x.loc || ''));
    const c2 = el('td', null, x.rule);
    const c3 = el('td');
    c3.append(el('span', null, x.before || '（空）'));
    c3.append(document.createTextNode(' → '));
    c3.append(el('b', null, x.after === '' ? '（删除）' : (x.after || '（空）')));
    if (x.count > 1) c3.append(el('span', 'hint', ' ×' + x.count));
    const c4 = el('td');
    c4.append(ctxCell(x.ctx));
    tr.append(c1, c2, c3, c4);
    tb.append(tr);
  });
  t.append(thead, tb);
  wrap.append(t);
  if (r.rows.length > 400) wrap.append(el('div', 'hint', '只显示前 400 行，完整明细看导出的 HTML 报告。'));
}

$('#runBtn').onclick = () => runFlow(true);
$('#execBtn').onclick = () => openConfirm();
$('#reportBtn').onclick = () => runFlow(true, true);
$('#showReportBtn').onclick = () => showPane('report');
$('#clearBtn').onclick = () => {
  lastRun = null;
  $('#showReportBtn').disabled = true;
  renderEmptyReport();
  renderTask();
};
$('#clearQueueBtn').onclick = () => {
  if (!queue.length) return;
  queue = [];
  renderQueue();
};

/* ── 执行确认 ─────────────────────────── */
function openConfirm() {
  const target = $('#target').value.trim();
  if (!target) { banner('err', '先选目标目录或文件'); return; }
  if (!previewFresh()) { banner('warn', '先空跑一次：目标或规则改过之后，要重新确认命中面才能执行。'); return; }
  const steps = stepsForRun();
  if (!steps.some(st => activeRules(st.rules).length)) { banner('err', '没有启用的规则，先启用几条'); return; }

  $('#cfTarget').textContent = target;

  const hitFiles = lastRun
    ? (lastRun.hitFiles !== undefined && lastRun.hitFiles !== null
        ? lastRun.hitFiles
        : new Set((lastRun.rows || []).map(x => x.file)).size)
    : 0;
  $('#cfScope').textContent = lastRun
    ? (hitFiles > 0
        ? hitFiles + ' 个文件（共扫描 ' + lastRun.files + ' 个）'
        : '0 个文件（扫描 ' + lastRun.files + ' 个，一处也没命中）')
    : '没有预演结果';
  $('#cfPreview').textContent = lastRun
    ? '命中 ' + lastRun.hits + ' 处 · 耗时 ' + lastRun.elapsedMs + ' ms · ' + fmtTime(new Date(lastRun.at || Date.now()))
    : '—';

  const bmap = {zip: '整体打包（上层目录 .bak.zip）', file: '按文件（同目录 .bak）', none: '不备份（无法回滚）'};
  $('#cfBackup').textContent = bmap[opts.backup] || opts.backup;
  $('#cfReport').textContent = opts.report || '（不导出）';
  $('#cfSteps').textContent = steps.map((st, i) => (i + 1) + '. ' + st.name).join('  →  ');

  const box = $('#cfRules');
  box.innerHTML = '';
  steps.forEach((st, i) => {
    const b = el('div', 'sblock');
    b.append(el('div', 'h', (i + 1) + '. ' + st.name));
    activeRules(st.rules).forEach(r => b.append(el('div', 'r', '· ' + ruleName(r) + '（' + (r.type || 'regex') + '）')));
    (st.rules || []).filter(r => r.enabled === false).forEach(r => b.append(el('div', 'r off', '× ' + ruleName(r) + '（停用，不跑）')));
    if (!activeRules(st.rules).length) b.append(el('div', 'r off', '（这一套没有启用的规则，会被跳过）'));
    box.append(b);
  });

  // 空跑 0 命中还来点执行，先提醒一句：这一趟不会改动任何文件
  const warn = $('#cfWarn');
  if (lastRun && lastRun.dry && lastRun.hits === 0) {
    warn.style.display = 'block';
    warn.textContent = '注意：最近一次空跑命中 0 处，执行不会改动任何文件。';
  } else {
    warn.style.display = 'none';
  }
  $('#confirmBox').classList.add('on');
}
$('#cfCancel').onclick = () => $('#confirmBox').classList.remove('on');
$('#confirmBox').onclick = e => { if (e.target.id === 'confirmBox') $('#confirmBox').classList.remove('on'); };
$('#cfOk').onclick = async () => {
  $('#confirmBox').classList.remove('on');
  await runFlow(false);
};

/* ── 规则库保存 / 另存为 ──────────────── */
function splitPath(p) {
  const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
  return i < 0 ? ['', p] : [p.slice(0, i), p.slice(i + 1)];
}
function joinPath(dir, name) {
  const sep = dir.indexOf('\\') >= 0 ? '\\' : '/';
  return dir.replace(/[\\/]+$/, '') + sep + name;
}

function openSaveAs() {
  const parts = splitPath(state.rulesPath || '');
  $('#saDir').value = parts[0];
  $('#saName').value = parts[1] || 'rules.json';
  $('#saMsg').textContent = '';
  $('#saveAsBox').classList.add('on');
}
$('#saveAsBtn').onclick = openSaveAs;
$('#saCancel').onclick = () => $('#saveAsBox').classList.remove('on');
$('#saveAsBox').onclick = e => { if (e.target.id === 'saveAsBox') $('#saveAsBox').classList.remove('on'); };
$('#saBrowse').onclick = () => {
  pickMode = 'saveas';
  $('#saveAsBox').classList.remove('on');
  $('#picker').classList.add('on');
  ls($('#saDir').value.trim() || '');
};
$('#saOk').onclick = async () => {
  const dir = $('#saDir').value.trim();
  let name = $('#saName').value.trim() || 'rules.json';
  if (!dir) { $('#saMsg').textContent = '先选目录'; return; }
  if (!/\.json$/i.test(name)) name += '.json';
  try {
    const res = await api('/api/rules', {rules: state.rules, baseMtime: 0, path: joinPath(dir, name)});
    if (!res.ok) { $('#saMsg').textContent = res.error || '保存失败'; return; }
    state.rulesPath = res.path;
    state.rulesMtime = res.mtime || 0;
    markClean();
    $('#saveAsBox').classList.remove('on');
    banner('ok', '已另存为 ' + state.rulesPath);
  } catch (e) {
    $('#saMsg').textContent = '保存失败：' + e.message;
  }
};

async function saveRules() {
  if (!state.rules.length) { banner('err', '规则库是空的，先从模板载入一套'); return; }
  try {
    const res = await api('/api/rules', {rules: state.rules, baseMtime: state.rulesMtime});
    if (res.ok) {
      state.rulesMtime = res.mtime;
      markClean();
      banner('ok', '已保存到 ' + state.rulesPath + (res.backup ? '（旧文件备份为 ' + baseName(res.backup) + '）' : ''));
    } else if (res.conflict) {
      banner('warn', res.error, {label: '重新加载', fn: () => location.reload()});
    } else {
      banner('err', res.error || '保存失败');
    }
  } catch (e) {
    banner('err', '保存失败：' + e.message);
  }
}
$('#saveBtn').onclick = saveRules;
$('#quitBtn').onclick = async () => {
  try { await api('/api/quit', {}); } catch (e) {}
  document.body.innerHTML = '<p style="padding:24px;font:14px system-ui">已退出，可以关掉这个标签页。</p>';
};

/* ── 模板 ─────────────────────────────── */
function applyPreset(p) {
  state.rules = JSON.parse(JSON.stringify(p.rules || []));
  loadedPreset = p.name;
  sel = 0;
  probe = null;
  markDirty();
  renderAll();
  // 模板把空库填上之后，「规则库还是空的」这条提示要撤掉
  const b = $('#banner');
  if (b.classList.contains('warn') && b.textContent.indexOf('规则库还是空的') === 0) banner('', '');
}

function loadPreset(p) {
  if (state.rules.length && !confirm('用模板「' + p.name + '」的 ' + (p.rules || []).length + ' 条规则替换当前规则库？\n（想留底就先点右上角「保存规则库」）')) return;
  applyPreset(p);
  banner('warn', '已载入模板「' + p.name + '」（' + (p.rules || []).length + ' 条 · ' + p.risk + '风险）。' + (p.note || ''));
}

$('#addBtn').onclick = () => {
  state.rules.push({id: 'rule' + (state.rules.length + 1), desc: '新规则', type: 'regex', pattern: '', replace: '{stars}', enabled: true});
  sel = state.rules.length - 1;
  loadedPreset = '';
  probe = null;
  markDirty();
  renderAll();
};

/* ── 启动 ─────────────────────────────── */
async function boot() {
  try {
    const res = await api('/api/state');
    if (!res.ok) { banner('err', res.error || '读取状态失败'); return; }
    const s = res.state;
    state = {rules: s.rules || [], presets: s.presets || [], rulesPath: s.rulesPath, rulesMtime: s.rulesMtime, version: s.version};
    sel = 0;
    renderAll();
    renderCases();
    renderOpts();
    updateTargetHint();
    renderEmptyReport();
    if (!state.rules.length) {
      banner('warn', '规则库还是空的：左栏「模板」点一个就有规则，改完点右上角「保存规则库」。');
    }
  } catch (e) {
    banner('err', '连不上本地服务：' + e.message);
  }
}

setInterval(() => api('/api/ping', {}).catch(() => {}), 4000);

/* ── 自检（scripts/ui-check.sh 用）──────── */
function dumpReport(rep) {
  const pre = document.createElement('pre');
  pre.id = 'selftest-report';
  pre.style.display = 'none';
  pre.textContent = JSON.stringify(rep);
  document.body.append(pre);
}

async function selftest(target) {
  const rep = {ok: true, presets: state.presets.length, rulesAtBoot: state.rules.length};
  const mode = new URLSearchParams(location.search).get('selftest');
  try {
    // 1) 载入模板 → 左栏渲染
    const p = state.presets.find(x => x.id === 'network') || state.presets[0];
    applyPreset(p);
    rep.preset = p.id;
    rep.rulesAfterLoad = state.rules.length;
    rep.editorTitle = $('#editTitle').textContent;
    rep.listRendered = document.querySelectorAll('#listRules .ritem').length;
    rep.casesRendered = document.querySelectorAll('#listCases .case').length;

    // 2) 目标 + 单条试跑
    setTarget(target);
    rep.targetValue = $('#target').value;
    await probeRule();
    await checkRule(state.rules[sel]); // 直接等结果，别让 450ms 防抖影响断言
    rep.probeHits = probe ? probe.hits : -1;
    rep.probeRows = document.querySelectorAll('#probeBox tbody tr').length;
    rep.checkLine = ($('#checkLine') || {}).textContent || '';

    // 3) 按钮配色、步骤条与布局（此时停在「规则配置」）
    const bg = id => getComputedStyle(document.querySelector(id)).backgroundColor;
    rep.colors = {dry: bg('#runBtn'), exec: bg('#execBtn'), clear: bg('#clearBtn')};
    const rect = id => document.querySelector(id).getBoundingClientRect();
    const re = rect('#editorPanel'), rp = rect('#taskPanel'), ra = rect('#actionBar');
    rep.layout = {
      editorWidth: Math.round(re.width), rightWidth: Math.round(rp.width),
      actionBarBottom: Math.round(ra.bottom), viewportH: innerHeight,
      pageOverflowX: document.documentElement.scrollWidth - document.documentElement.clientWidth,
    };
    rep.steps = document.querySelectorAll('#stepBar .step').length;
    rep.stepActive = activeStep;
    rep.stepLabels = [1, 2, 3, 4].map(n => $('#step' + n + 'v').textContent);
    rep.cfgStepOn = $('#step2').classList.contains('on');
    rep.execDisabledBefore = $('#execBtn').disabled;
    rep.cfgPaneVisible = getComputedStyle($('#paneCfg')).display !== 'none';

    // 4) 要看「停用的规则」时先停一条再入队
    if (mode === 'confirmoff' && state.rules.length) {
      state.rules[0].enabled = false;
      renderAll();
    }
    enqueue();
    rep.queueLen = queue.length;
    rep.queueCards = document.querySelectorAll('#queueList .q:not(.total)').length;

    // 4) 队列徽标：改一下规则库，应变成「规则库已改」
    const snapshot = JSON.stringify(state.rules[0]);
    state.rules[0].note = 'selftest';
    renderQueue();
    rep.queueWarnBadge = document.querySelectorAll('#queueList .q .badge.warn').length;
    state.rules[0] = JSON.parse(snapshot);
    renderQueue();
    // 只想看「规则配置」页时停在这里（截图用）
    if (mode === 'cfg') {
      dumpReport(rep);
      return;
    }

    // 5) 空跑（走真实接口）→ 自动切到「运行报告」
    const res = await runFlow(true);
    rep.hits = res ? res.hits : -1;
    rep.files = res ? res.files : -1;
    rep.rows = res ? (res.rows || []).length : -1;
    rep.marked = document.querySelectorAll('#rowsWrap mark').length;
    rep.queueEst = (queue.length && queue[0].est) ? queue[0].est.hits : -1;
    rep.summary = $('#summary').textContent.trim();

    // 6) 标签页：跑完应在「运行报告」，且能切回规则配置
    rep.reportStepOn = $('#step3').classList.contains('on') || $('#step4').classList.contains('on');
    rep.reportPaneVisible = getComputedStyle($('#paneReport')).display !== 'none';
    rep.reportRows = document.querySelectorAll('#rowsWrap tbody tr').length;
    rep.step3Label = $('#step3v').textContent;
    rep.reportMeta = $('#reportMeta').textContent;
    rep.showReportEnabled = !$('#showReportBtn').disabled;
    rep.execEnabledAfter = !$('#execBtn').disabled;
    rep.taskState = $('#taskState').textContent;
    showPane('cfg');
    rep.cfgBackVisible = getComputedStyle($('#paneCfg')).display !== 'none';
    showPane('report');
    // 只想看「空跑后」的界面时停在这里（截图用，不写盘）
    if (mode === 'dry') {
      dumpReport(rep);
      return;
    }

    // 7) 执行确认弹窗：只列启用规则，停用的单独标注
    openConfirm();
    rep.confirmShown = $('#confirmBox').classList.contains('on');
    rep.confirmBlocks = document.querySelectorAll('#cfRules .sblock').length;
    rep.confirmActive = document.querySelectorAll('#cfRules .r:not(.off)').length;
    rep.confirmOff = document.querySelectorAll('#cfRules .off').length;
    rep.cfScope = $('#cfScope').textContent;
    rep.cfPreview = $('#cfPreview').textContent;
    if (mode === 'confirm' || mode === 'confirmoff') {
      dumpReport(rep);
      return;
    }
    $('#cfCancel').click();

    // 9) 真执行（样例目录是临时拷贝）
    const r3 = await runFlow(false);
    rep.executed = r3 ? r3.written : -1;
    rep.execHits = r3 ? r3.hits : -1;
    rep.execFailed = r3 ? r3.failed : -1;
    rep.banner = $('#banner').className;

    // 10) 删除图片规则：编辑器只给说明，不再显示 pattern / replace
    if (state.rules.length) {
      state.rules[0].type = 'strip_images';
      state.rules[0].pattern = '';
      state.rules[0].replace = '';
      renderAll();
      await checkRule(state.rules[0]);
      rep.stripRuleOption = Array.from(document.querySelectorAll('#editor select option'))
        .some(o => o.value === 'strip_images');
      rep.stripRuleInputs = document.querySelectorAll('#editor input').length;
      rep.stripRuleEditor = ($('#checkLine') || {}).textContent || '';
    }
  } catch (e) {
    rep.ok = false;
    rep.error = String(e);
  }
  dumpReport(rep);
}

const qp = new URLSearchParams(location.search);
boot().then(() => {
  if (!qp.get('selftest')) return;
  if (qp.get('selftest') === 'strip') stripShot(qp.get('target') || '');
  else selftest(qp.get('target') || '');
});

// strip 模式：只把「文档去图」模板载入并停在规则配置页，给截图与人工核对用
async function stripShot(target) {
  const p = state.presets.find(x => x.id === 'images');
  if (p) applyPreset(p);
  setTarget(target);
  sel = 0;
  renderAll();
  await checkRule(state.rules[0]);
  dumpReport({ok: true, stripShot: true, checkLine: ($('#checkLine') || {}).textContent || ''});
}
</script>
