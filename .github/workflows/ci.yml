name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: go ${{ matrix.os }} / ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26.x"
          - os: windows-latest
            go: "1.26.x"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: 格式检查
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: 编译
        shell: bash
        run: |
          mkdir -p dist
          out=dist/desensitize
          if [ "${{ runner.os }}" = "Windows" ]; then out=dist/desensitize.exe; fi
          go build -ldflags "-s -w -X main.version=ci" -o "$out" ./cmd/desensitize
          "$out" --version
